# Top-level PR workflow for the devops-data-engineering chapter codebase.
# Mirror of labs/06-ci-cd-github-actions/workflow-templates/pr.yml so the
# repo is self-validating; if you adopt this pattern in your own repo,
# copy from labs/06-... and adapt secrets / paths.
name: pr

on:
  pull_request:
    branches: [main]
    paths:
      - "devops-data-engineering/**"

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: pre-commit/action@v3.0.1
        with:
          extra_args: --files devops-data-engineering/

  unit-tests:
    runs-on: ubuntu-latest
    needs: pre-commit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install
        run: |
          pip install pytest pyspark==3.5.0 jsonschema pyyaml
      - name: Unit
        run: pytest devops-data-engineering/reference-pipeline/tests/unit -q
      - name: Contract
        run: pytest devops-data-engineering/labs/05-pipeline-testing-strategy/contracts -q

  terraform-validate:
    runs-on: ubuntu-latest
    needs: pre-commit
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.8.5 }
      - name: tf fmt + validate
        run: |
          for d in devops-data-engineering/reference-pipeline/terraform/modules/*; do
            terraform -chdir="$d" init -backend=false
            terraform -chdir="$d" validate
          done
          for d in devops-data-engineering/reference-pipeline/terraform/envs/*; do
            terraform -chdir="$d" init -backend=false
            terraform -chdir="$d" validate
          done
          terraform fmt -recursive -check devops-data-engineering/
