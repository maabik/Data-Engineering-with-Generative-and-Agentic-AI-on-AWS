# Lightweight policy gate for the chapter codebase itself.
# Runs Conftest + Checkov against the reference pipeline's plan JSON
# fixture. The fixture is generated by the integration job in a real
# repo; for the chapter codebase we run against a synthesized plan.
name: policy

on:
  pull_request:
    paths:
      - "devops-data-engineering/labs/04-policy-as-code/**"
      - "devops-data-engineering/reference-pipeline/terraform/**"

permissions:
  contents: read

jobs:
  conftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Conftest
        run: |
          curl -sSL -o conftest.tgz https://github.com/open-policy-agent/conftest/releases/download/v0.55.0/conftest_0.55.0_Linux_x86_64.tar.gz
          tar -xzf conftest.tgz
          sudo mv conftest /usr/local/bin/
      - name: Verify Rego syntax
        run: |
          conftest verify --policy devops-data-engineering/labs/04-policy-as-code/policies

  checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pipx install checkov
      - name: Checkov against reference pipeline
        run: |
          checkov -d devops-data-engineering/reference-pipeline/terraform/ \
            --config-file devops-data-engineering/labs/04-policy-as-code/.checkov.yaml \
            --quiet --compact
