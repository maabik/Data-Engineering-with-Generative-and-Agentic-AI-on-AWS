name: pr-deploy-sandbox

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: sandbox-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: sandbox
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.8.5 }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.SANDBOX_DEPLOY_ROLE }}
          aws-region: us-east-1
      - name: Apply
        working-directory: reference-pipeline/terraform/envs/sandbox
        env:
          TF_WORKSPACE: pr-${{ github.event.pull_request.number }}
          TF_VAR_owner: pr-${{ github.event.pull_request.number }}
        run: |
          terraform init
          terraform workspace new $TF_WORKSPACE 2>/dev/null || terraform workspace select $TF_WORKSPACE
          terraform apply -auto-approve

  integration:
    needs: apply
    runs-on: ubuntu-latest
    environment: sandbox
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.8.5 }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.SANDBOX_DEPLOY_ROLE }}
          aws-region: us-east-1
      - run: pip install -r reference-pipeline/requirements-dev.txt
      - name: Integration tests
        working-directory: reference-pipeline/terraform/envs/sandbox
        env:
          TF_WORKSPACE: pr-${{ github.event.pull_request.number }}
        run: |
          terraform init
          terraform workspace select $TF_WORKSPACE
          cd ../../..
          pytest tests/integration --timeout=900 -q
      - name: Sandbox DQ
        run: |
          python labs/05-pipeline-testing-strategy/smoke/run_dq.py \
            --contract labs/05-pipeline-testing-strategy/contracts/expectations/region_revenue.yaml \
            --database "$(terraform -chdir=reference-pipeline/terraform/envs/sandbox output -raw curated_database)" \
            --output-location "s3://$(terraform -chdir=reference-pipeline/terraform/envs/sandbox output -raw curated_bucket)/_dq_smoke/"
