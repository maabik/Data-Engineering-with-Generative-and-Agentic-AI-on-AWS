name: release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  prod-apply:
    runs-on: ubuntu-latest
    environment: prod        # GitHub: requires manual approval (configured in env settings)
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { ref: ${{ github.event.release.tag_name }} }
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.8.5 }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.PROD_DEPLOY_ROLE }}
          aws-region: us-east-1
      - name: Apply prod
        working-directory: reference-pipeline/terraform/envs/prod
        run: |
          terraform init
          terraform apply -auto-approve

  prod-smoke-and-dq:
    needs: prod-apply
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { ref: ${{ github.event.release.tag_name }} }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.8.5 }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.PROD_DEPLOY_ROLE }}
          aws-region: us-east-1
      - run: pip install -r reference-pipeline/requirements-dev.txt
      - id: smoke
        name: Smoke + DQ
        env:
          TF_DIR: reference-pipeline/terraform/envs/prod
        run: |
          terraform -chdir=$TF_DIR init
          pytest labs/05-pipeline-testing-strategy/smoke/test_smoke.py -q
          python labs/05-pipeline-testing-strategy/smoke/run_dq.py \
            --contract labs/05-pipeline-testing-strategy/contracts/expectations/region_revenue.yaml \
            --database "$(terraform -chdir=$TF_DIR output -raw curated_database)" \
            --output-location "s3://$(terraform -chdir=$TF_DIR output -raw curated_bucket)/_dq_smoke/"

      - name: Roll back on smoke/DQ failure
        if: failure() && steps.smoke.outcome == 'failure'
        run: |
          echo "Smoke or DQ failed; rolling back to previous tag."
          ./scripts/rollback-to-previous-tag.sh prod
