[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guardrails-from-policy"
version = "0.1.0"
description = "Ingest a corporate data-classification or AUP policy and emit a Bedrock Guardrails config"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.34",
    "pypdf>=4.0",
]

[project.optional-dependencies]
docx = ["python-docx>=1.1"]
dev = ["pytest>=8", "pytest-mock>=3"]

[project.scripts]
policy2guardrail = "guardrails_from_policy.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["guardrails_from_policy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
