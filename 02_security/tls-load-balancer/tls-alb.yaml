AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Internet-facing Application Load Balancer that terminates TLS using an
  ACM-issued certificate validated via Route 53 DNS, with an alias A record
  pointing the provided domain at the ALB. Creates an empty target group
  that you register backends into.

Parameters:
  DomainName:
    Type: String
    Description: Fully qualified domain name for the ALB (e.g. api.example.com)
    AllowedPattern: ^[a-zA-Z0-9.-]+\.[a-zA-Z]{2,}$

  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: Route 53 public hosted zone that is authoritative for DomainName

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC in which to place the ALB and target group

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Two or more public subnets in different AZs for the ALB

  TargetPort:
    Type: Number
    Default: 80
    Description: Port the ALB forwards to on registered targets

  HealthCheckPath:
    Type: String
    Default: /
    Description: HTTP path the ALB uses for target health checks

Resources:
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "ALB ingress for ${DomainName}"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS from anywhere
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP for redirect to HTTPS

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: internet-facing
      IpAddressType: ipv4
      Subnets: !Ref SubnetIds
      SecurityGroups:
        - !Ref AlbSecurityGroup

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: !Ref TargetPort
      TargetType: instance
      HealthCheckProtocol: HTTP
      HealthCheckPath: !Ref HealthCheckPath
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: '200-399'

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref Certificate
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  HttpRedirectListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: '443'
            Host: '#{host}'
            Path: '/#{path}'
            Query: '#{query}'
            StatusCode: HTTP_301

  AliasRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt LoadBalancer.DNSName
        HostedZoneId: !GetAtt LoadBalancer.CanonicalHostedZoneID
        EvaluateTargetHealth: false

Outputs:
  LoadBalancerDnsName:
    Description: ALB's AWS-assigned DNS name
    Value: !GetAtt LoadBalancer.DNSName

  LoadBalancerArn:
    Description: ARN of the ALB
    Value: !Ref LoadBalancer

  TargetGroupArn:
    Description: Register backends into this target group
    Value: !Ref TargetGroup

  CertificateArn:
    Description: ACM certificate ARN attached to the HTTPS listener
    Value: !Ref Certificate

  HttpsUrl:
    Description: Public URL served by the ALB
    Value: !Sub "https://${DomainName}/"
