[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-finops-data-lake"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34.0",
    "aws-cdk-lib>=2.130.0",
    "constructs>=10.0.0",
]

[project.optional-dependencies]
glue = [
    "boto3>=1.34.0",
    "pyarrow>=14.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "freezegun>=1.4.0",
    "moto[s3,glue,athena,sts]>=5.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pipeline*", "glue*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
