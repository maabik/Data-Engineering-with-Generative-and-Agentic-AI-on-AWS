[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-run-cost-tracer"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34.0",
]

[project.optional-dependencies]
strands = [
    "strands-agents>=0.1.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "freezegun>=1.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["tracer*", "stitcher*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
