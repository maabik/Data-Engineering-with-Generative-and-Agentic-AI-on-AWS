[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-injection-test-harness"
version = "0.1.0"
description = "Runnable prompt-injection test suite for Bedrock agents (210+ payloads)"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.34",
]

[project.optional-dependencies]
strands = ["strands-agents>=0.1"]
dev = ["pytest>=8", "pytest-xdist>=3"]

[project.scripts]
pi-harness = "harness.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["harness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
