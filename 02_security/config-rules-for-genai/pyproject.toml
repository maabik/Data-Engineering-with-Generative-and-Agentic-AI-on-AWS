[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "config-rules-for-genai"
version = "0.1.0"
description = "Custom AWS Config rules for GenAI and MCP security risks"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-mock>=3"]

[tool.setuptools.packages.find]
where = ["."]
include = ["lib*", "rules*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
