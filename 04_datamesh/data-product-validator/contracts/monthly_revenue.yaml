# Contract for the monthly_revenue producer asset. The seed leaves this
# asset un-published, so running `dpv publish` exercises the publish path.
asset: monthly_revenue
project: chocolate-producer
description: Monthly revenue rollup derived from cocoa_shipments

columns:
  - name: id
    type: string
    required: true
  - name: amount
    type: double
    required: true
  - name: ts
    type: timestamp
    required: true
