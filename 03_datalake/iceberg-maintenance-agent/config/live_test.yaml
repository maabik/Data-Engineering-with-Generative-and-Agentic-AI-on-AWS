tables:
  - s3://apache-iceberg-us-east-1-123456789012/iceberg/maintenance_test
  - s3://icebergdebuggerstack-databuckete3889a50-qamhbqkafffi/iceberg/permits

catalog:
  type: glue
  properties:
    region_name: us-east-1

thresholds:
  compaction:
    small_file_size_mb: 128
    small_file_count_threshold: 5    # low so our tiny test table triggers it
    small_file_ratio_threshold: 0.3
  snapshots:
    max_snapshots: 10                # low so 25 snapshots triggers expiration
    retention_hours: 1               # 1h so all old snapshots expire
  orphans:
    age_hours: 1
  query_latency:
    p95_warning_ms: 5000
    p95_critical_ms: 15000
    degradation_pct: 50

monitoring:
  mode: on-demand
  interval_seconds: 3600

aws:
  region: us-east-1

anthropic_model: us.anthropic.claude-sonnet-4-6
dry_run: true   # safe for first live run — analyse and report, no writes
