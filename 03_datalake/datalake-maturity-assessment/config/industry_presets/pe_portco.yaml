# PE-portfolio-company preset: cost discipline and AI-readiness drive value creation,
# access/security tends to be a post-LBO weakness. Lower weights on lineage/quality
# (typically a year-2 concern in PE).
weights:
  storage_format: 1.0
  catalog_schema: 1.0
  access_security: 1.5
  quality_observability: 1.0
  performance_ingestion: 1.0
  cost_lifecycle: 1.5
  lineage: 1.0
  ai_readiness: 1.5

targets:
  default_target_level: 4
  minimum_acceptable: 2
